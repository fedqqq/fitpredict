[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitpredict"
version = "1.0.1"
description = "Declarative PyTorch experiment runner for tabular data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "fitpredict contributors" }]
keywords = ["pytorch", "machine-learning", "training", "tabular"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "torch>=2.3",
  "tensorboard>=2.16",
  "mlflow>=2.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "wheel>=0.43",
  "mypy>=1.8",
  "pytest>=8.0",
  "ruff>=0.16",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/fedqqq/fitpredict"
Repository = "https://github.com/fedqqq/fitpredict"

[tool.setuptools.packages.find]
where = ["."]
include = ["fitpredict*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = false
