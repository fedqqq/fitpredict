data:
  path: examples/data/regression.json
  format: json
  features: [x1, x2]
  targets: [y]
  split: {train: 0.5, val: 0.3333333333333333, test: 0.16666666666666666, shuffle: false}
model:
  class: examples.models:MultiInputRegressor
  inputs:
    left: {source: features.x1, dtype: float32}
    right: {source: features.x2, dtype: float32}
training:
  epochs: 2
  batch_size: 2
  shuffle: false
  device: cpu
  optimizer: {name: SGD, params: {lr: 0.01}}
  objectives:
    - loss: {name: MSELoss}
      bindings:
        input: {source: outputs, dtype: float32}
        target: {source: targets.y, dtype: float32}
evaluation: {metrics: []}
logging: {console: true, tensorboard: false, mlflow: false}
saving:
  output_dir: runs/examples/multi_input
  save_last: true
  save_best: {monitor: val.loss, mode: min}
