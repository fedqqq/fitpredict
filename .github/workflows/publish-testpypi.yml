name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: Expected package version, for example 1.0.1
        required: true
        default: 1.0.1

permissions:
  contents: read
  id-token: write

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests

jobs:
  publish-testpypi:
    name: Build and publish TestPyPI package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fitpredict/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check fitpredict tests examples scripts

      - name: Ruff format check
        run: python -m ruff format --check fitpredict tests examples scripts

      - name: Type check
        run: python -m mypy fitpredict

      - name: Tests
        run: python -m pytest -q

      - name: Syntax check
        run: python -m compileall -q fitpredict tests examples scripts

      - name: Build distributions
        run: python -m build

      - name: Check version metadata
        run: python scripts/check_version.py --expected-version '${{ inputs.expected-version }}'

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Verify install from TestPyPI
        run: |
          python -m pip install --no-cache-dir --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "fitpredict==${{ inputs.expected-version }}"
          python -c "import importlib.metadata; print(importlib.metadata.version('fitpredict'))"
