name: CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check --select E9,F fitpredict tests

      - name: Run tests
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path("pytest.log").read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failed::{text}")
          PY
            exit "$status"
          fi

      - name: Syntax check
        run: python -m compileall -q fitpredict tests
