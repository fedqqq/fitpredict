name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests

jobs:
  publish-pypi:
    name: Build, release, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/project/fitpredict/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check fitpredict tests examples scripts

      - name: Ruff format check
        run: python -m ruff format --check fitpredict tests examples scripts

      - name: Type check
        run: python -m mypy fitpredict

      - name: Tests
        run: python -m pytest -q

      - name: Syntax check
        run: python -m compileall -q fitpredict tests examples scripts

      - name: Build distributions
        run: python -m build

      - name: Check release version metadata
        run: python scripts/check_version.py --tag '${{ github.ref_name }}'

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create '${{ github.ref_name }}' dist/* --title '${{ github.ref_name }}' --notes-file CHANGELOG.md

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
